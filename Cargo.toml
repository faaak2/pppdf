[package]
name = "pppdf"
version = "1.5.1"
edition = "2021"
rust-version = "1.82"
description = "Borderless native PDF viewer for tabletop RPG sessions"

[features]
# Paid edition: form-fillable elements, user-created labels/inputs.
# Free build:  cargo build --release
# Pro build:   cargo build --release --features pro
pro = []

[dependencies]
pdfium-render = { version = "0.9.2", default-features = false, features = ["pdfium_latest", "thread_safe"] }

[dependencies.windows]
version = "0.62.2"
features = [
    "Win32_Foundation",                # HWND/WPARAM/LPARAM/LRESULT/RECT, D2DERR_RECREATE_TARGET
    "Win32_System_LibraryLoader",      # GetModuleHandleW
    "Win32_UI_WindowsAndMessaging",    # window class, message loop, menus, timers, cursors
    "Win32_Graphics_Gdi",              # HBRUSH (WNDCLASSEXW), BeginPaint, MonitorFromWindow
    "Win32_Graphics_Direct2D",
    "Win32_Graphics_Direct2D_Common",
    "Win32_Graphics_Dxgi_Common",      # DXGI_FORMAT_B8G8R8A8_UNORM
    "Win32_Graphics_DirectWrite",
    "Win32_Graphics_Dwm",              # DwmSetWindowAttribute, corner preference
    "Win32_UI_HiDpi",                  # SetProcessDpiAwarenessContext, GetDpiForWindow
    "Win32_UI_Shell",                  # DragAcceptFiles/DragQueryFileW, ShellExecuteW
    "Win32_UI_Controls_Dialogs",       # GetOpenFileNameW
    "Win32_UI_Input_KeyboardAndMouse", # VK_*, GetKeyState
    "Win32_System_SystemServices",     # MK_CONTROL (mouse-message modifier flags)
    "Win32_System_Registry",           # --register: HKCU file-association keys
    "Win32_Security",                  # SECURITY_ATTRIBUTES in RegCreateKeyExW's signature
    "Win32_System_Com",                # --register: IShellLinkW Start-menu shortcut
    "Win32_System_DataExchange",       # Ctrl+V paste into form fields (pro)
    "Win32_System_Memory",             # Ctrl+V paste into form fields (pro)
]

[build-dependencies]
embed-manifest = "1.5.0"
winresource = "0.1.31"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true

# Vendored copy of the exact pinned version, carrying only the accessor
# patches documented in vendor/PATCHES.md (form handles for Pro form filling).
[patch.crates-io]
pdfium-render = { path = "vendor/pdfium-render" }
